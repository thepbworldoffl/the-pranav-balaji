<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- PB World Official Monogram Logo Placeholder -->
  <!-- Note: Replace this vector or place your uploaded PB logo in /public/pb-logo.svg -->
  <defs>
    <linearGradient id="pb-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="pb-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame Ring -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" 
           stroke="url(#pb-metal)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           fill="#0A0D14" 
           fill-opacity="0.9" />

  <!-- Inner Ambient Glow Accent Lines -->
  <polygon points="60,14 100,37 100,83 60,106 20,83 20,37" 
           stroke="url(#pb-accent)" 
           stroke-width="1" 
           stroke-linejoin="round"
           stroke-opacity="0.4" 
           fill="none" />

  <!-- Monogram P & B Interlocked Core -->
  <g transform="translate(6, 4)">
    <!-- Central Stem (Shared Spine of P and B) -->
    <rect x="34" y="24" width="8" height="60" rx="2" fill="url(#pb-metal)" />

    <!-- 'P' Upper Loop -->
    <path d="M42 24 H64 C74 24 81 30 81 39 C81 48 74 54 64 54 H42 Z" 
          fill="none" 
          stroke="url(#pb-metal)" 
          stroke-width="7" 
          stroke-linejoin="round" />

    <!-- 'B' Lower Loop with Forward Dynamic Cut -->
    <path d="M42 54 H67 C78 54 85 60 85 70 C85 79 77 84 66 84 H38" 
          fill="none" 
          stroke="url(#pb-metal)" 
          stroke-width="7" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Core Geometric Cutouts / Negative Space Accents -->
    <circle cx="58" cy="39" r="3.5" fill="#38BDF8" fill-opacity="0.85" />
    <circle cx="61" cy="69" r="3.5" fill="#818CF8" fill-opacity="0.85" />

    <!-- Cinematic Tech Accent Notch -->
    <line x1="28" y1="54" x2="34" y2="54" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
